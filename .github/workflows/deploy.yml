# Builds the site and deploys it to Cloudflare Pages (project: menssupplyhouse) on every push to main.
# Needs one repo secret: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit, Account Settings > Read).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c654a1594e342c9301d5d51feebcbb2
          command: pages deploy dist --project-name=menssupplyhouse --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
